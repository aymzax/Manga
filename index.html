<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Manga</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #e94560;
            font-size: 2rem;
        }
        .logo p { color: #aaa; font-size: 0.9rem; margin-top: 5px; }
        
        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block;
            color: #ddd;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 1rem;
        }
        .input-group input:focus {
            outline: none;
            border-color: #e94560;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
        }
        .btn-login {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: #fff;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233,69,96,0.4);
        }
        .btn-signup {
            background: transparent;
            color: #e94560;
            border: 2px solid #e94560;
            margin-top: 12px;
        }
        .btn-signup:hover {
            background: #e94560;
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .msg {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }
        .msg.error { color: #ff6b6b; }
        .msg.success { color: #4ade80; }
        
        .divider {
            text-align: center;
            margin: 15px 0;
            color: #666;
            font-size: 0.85rem;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider::before { right: 0; }
        .divider::after { left: 0; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <h1>📚 Solo Manga</h1>
            <p id="formTitle">تسجيل الدخول إلى حسابك</p>
        </div>
        
        <form id="authForm">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-login" id="submitBtn">تسجيل الدخول</button>
        </form>
        
        <div class="divider">أو</div>
        
        <button class="btn btn-signup" id="toggleBtn" onclick="toggleMode()">إنشاء حساب جديد</button>
        
        <div class="msg" id="msg"></div>
    </div>

    <script src="app.js"></script>
    <script>
        document.getElementById('authForm').addEventListener('submit', handleAuth);
    </script>
</body>
</html>
